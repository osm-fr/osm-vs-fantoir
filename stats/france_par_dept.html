<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statistiques nationales par département</title>
<script src="../pifometre/js/jquery-3.6.4.min.js"></script>
<script src="../pifometre/js/tablesorter/jquery.tablesorter.js"></script>
<script src="../pifometre/js/jquery.tablesorter.combined.min.js"></script>
<script src="../pifometre/js/tablesorter/widgets/widget-staticRow.min.js"></script>
<script src="../pifometre/js/fonctions.js"></script>
<script defer src="../pifometre/js/menu.js"></script>
<link rel="preload" href="../pifometre/css/fonts/opensans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../pifometre/css/tablesorter/theme.default.min.css" type="text/css"/>
<link rel="stylesheet" href="../pifometre/css/style.css" type="text/css"/>
<link rel="stylesheet" href="../pifometre/css/responsive.css" type="text/css"/>

</head>
<body onload="start()">
    <header>
        <!--#include virtual="../includes/menu.html" -->
    </header>

    <div id="barre-jaune">
    </div>

    <div id="bandeau">
        <div id="descriptif">
            <h1>Statistiques nationales par département</h1>
            <h3>Ce tableau est rafraîchi tous les jours. La dernière mise à jour date du <span id="date_du_calcul"></span>.</h3>
        </div>
        <button id="bouton_export_csv" title="Exporter le tableau en CSV" onclick="window.open('../pifometre/stats_france_par_dept.py?format=csv', '_blank');"></button>
        <div id="wait_ajax" class="bas"></div>
    </div>

    <div id="reponse" class="haut">
        <table id="stats_fra_par_dept" class="tablesorter"></table>
    </div>

    <footer>
     <!--#include virtual="../includes/footer.html" -->
    </footer>

    <script>

        // var a_champs_stats = ['Département','Communes','Addresses OSM','Addresses BAN','% OSM/BAN','Voies BAN rapprochées','Voies BAN','% rapprochées','BAL']

        function start(){
            update_menu_visits()
            $('body').css('cursor','progress');
            $('#wait_ajax').empty()
                            .css('visibility','visible')
                            .append($('<p>').append('Chargement des statistiques...'));
            $.ajax({
                url: "../pifometre/stats_france_par_dept.py"
            })
            .done(function( data ) {
                $('body').css('cursor','default');
                $('#wait_ajax').css('visibility','hidden');

                $('#stats_fra_par_dept').empty().append($('<thead>').append($('<tr>')))

                date_du_calcul = data["date_du_calcul"]
                $('span#date_du_calcul').text(date_du_calcul)

                colonnes = data["colonnes"]
                france = data["france"]
                departements = data["departements"]

                for (c=0;c<colonnes.length;c++){
                    $('#stats_fra_par_dept > thead > tr:last').append($('<th>').append(colonnes[c]))
                }
                $('#stats_fra_par_dept').append($('<tbody>'))

                //test
                $('#stats_fra_par_dept').append($('<tr>'))
                for (d=0;d<france.length;d++){
                    $('#stats_fra_par_dept tr:last').addClass('static').append($('<td>').append(france[d].toLocaleString()))
                }

                for (c=0;c<departements.length;c++){
                    $('#stats_fra_par_dept').append($('<tr>'))
                    for (d=0;d<departements[c].length;d++){
                        $('#stats_fra_par_dept tr:last').append($('<td>').append(departements[c][d].toLocaleString()))
                    }
                }

                $('#stats_fra_par_dept').tablesorter({
                    widthFixed : true,
                    headerTemplate : '{content} {icon}', // Add icon for various themes
                    widgets: [ 'stickyHeaders', 'staticRow', 'filter' ],
                    widgetOptions: {
                      stickyHeaders_attachTo : '#reponse'
                    }
                });

            })
        }

    </script>
</body>
</html>
