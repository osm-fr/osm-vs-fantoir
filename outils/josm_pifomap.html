<html>
<head>
<meta charset="UTF-8">
<title>Pifomap depuis JOSM</title>
<script src="../js/jquery-3.6.4.min.js"></script>
<script>
	function start(){
		check_url_for_coords()
	};
	function check_url_for_coords(){
		var lon, lat
		if (window.location.search){
			if (window.location.search.split('lat=')[1].split('&')[0]){
				lat = Number(window.location.search.split('lat=')[1].split('&')[0])
			}
			if (window.location.search.split('lon=')[1].split('&')[0]){
			    lon = Number(window.location.search.split('lon=')[1].split('&')[0])
			}
		}
		if (-90 < lat && lat < 90 && -180 < lon && lon < 180){
				$.ajax({
				url: "../pifometre/insee_from_coords.py?lat="+lat+"&lon="+lon
			})
			.done(function( data ) {
				data=data[0]
                window.location.replace('../pifometre/pifomap.html?insee='+data[0]+'&ratio=no#map=17/'+lat+'/'+lon)
			})

		} else {
            window.location.replace('../pifometre/pifomap.html?insee=404')
		}
	}
</script>
</head>
<body onload="start()">
</body>
</html>
